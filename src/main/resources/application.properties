# アプリケーション名
spring.application.name=kakeibo

# DB接続設定: SQLiteのファイルDB（kakeibo.db）をプロジェクト直下に作成して使う
spring.datasource.url=jdbc:sqlite:kakeibo.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA(Hibernate)設定
# SQLiteはHibernate標準では非対応のため、コミュニティ提供のSQLite用Dialectを指定する
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# ddl-auto=update: エンティティ定義の変更に応じてテーブルを自動的に作成・更新する
spring.jpa.hibernate.ddl-auto=update
# 実行されるSQLをログに出すかどうか（デバッグ時はtrueにすると見やすい）
spring.jpa.show-sql=false
# Thymeleafのレンダリング中でも遅延ロードのプロパティにアクセスできるようにする
spring.jpa.open-in-view=true

# Webサーバーのポート番号（http://localhost:8080 でアクセスする）
server.port=8080

# Anthropic API キー（環境変数 ANTHROPIC_API_KEY から取得）
anthropic.api.key=${ANTHROPIC_API_KEY:}

# レシート画像アップロードのファイルサイズ上限
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
