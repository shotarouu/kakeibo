<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('取引一覧')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>

    <!-- ===== 月切替ナビ ===== -->
    <div class="month-nav">
        <a class="btn-month" th:href="@{/transactions(month=${prevMonth})}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            前月
        </a>
        <div class="month-label" th:text="${currentMonth}">2026-06</div>
        <a class="btn-month" th:href="@{/transactions(month=${nextMonth})}">
            次月
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
    </div>

    <!-- ===== サマリー ===== -->
    <div class="summary-section">
        <div class="summary-card income-card">
            <div class="summary-card-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </div>
            <div class="summary-card-content">
                <div class="summary-card-label">収入合計</div>
                <div class="summary-card-value income-value"
                     th:text="'¥' + ${#numbers.formatInteger(summary.totalIncome, 1, 'COMMA')}">¥0</div>
            </div>
        </div>

        <div class="summary-center">
            <div class="balance-label">収支</div>
            <div class="balance-value"
                 th:classappend="${summary.balance >= 0} ? ' balance-positive' : ' balance-negative'"
                 th:text="(${summary.balance >= 0} ? '+' : '') + '¥' + ${#numbers.formatInteger(summary.balance, 1, 'COMMA')}">¥0</div>
            <!-- バランスバー -->
            <div class="balance-bar-wrap" th:if="${summary.totalIncome > 0 or summary.totalExpense > 0}">
                <div class="balance-bar-track">
                    <div class="balance-bar-income" id="balanceBarIncome"></div>
                    <div class="balance-bar-expense" id="balanceBarExpense"></div>
                </div>
                <div class="balance-bar-ticks">
                    <span class="tick-income">収入</span>
                    <span class="tick-expense">支出</span>
                </div>
            </div>
        </div>

        <div class="summary-card expense-card">
            <div class="summary-card-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
            </div>
            <div class="summary-card-content">
                <div class="summary-card-label">支出合計</div>
                <div class="summary-card-value expense-value"
                     th:text="'¥' + ${#numbers.formatInteger(summary.totalExpense, 1, 'COMMA')}">¥0</div>
            </div>
        </div>
    </div>

    <!-- ===== グラフエリア ===== -->
    <div class="charts-section" th:if="${summary.totalIncome > 0 or summary.totalExpense > 0}">

        <!-- 収入グラフカード -->
        <div class="chart-card income-chart-card" th:if="${summary.totalIncome > 0}">
            <div class="chart-card-header income-header">
                <div class="chart-card-icon-wrap">💰</div>
                <div class="chart-card-meta">
                    <div class="chart-card-title">収入の内訳</div>
                    <div class="chart-card-total"
                         th:text="'¥' + ${#numbers.formatInteger(summary.totalIncome, 1, 'COMMA')}">¥0</div>
                </div>
            </div>
            <div class="chart-card-body">
                <div class="chart-canvas-wrap">
                    <canvas id="incomeChart" width="200" height="200"></canvas>
                    <div class="chart-center" id="incomeCenterLabel"></div>
                </div>
                <div class="chart-legend" id="incomeLegend"></div>
            </div>
        </div>

        <!-- 支出グラフカード -->
        <div class="chart-card expense-chart-card" th:if="${summary.totalExpense > 0}">
            <div class="chart-card-header expense-header">
                <div class="chart-card-icon-wrap">💸</div>
                <div class="chart-card-meta">
                    <div class="chart-card-title">支出の内訳</div>
                    <div class="chart-card-total"
                         th:text="'¥' + ${#numbers.formatInteger(summary.totalExpense, 1, 'COMMA')}">¥0</div>
                </div>
            </div>
            <div class="chart-card-body">
                <div class="chart-canvas-wrap">
                    <canvas id="expenseChart" width="200" height="200"></canvas>
                    <div class="chart-center" id="expenseCenterLabel"></div>
                </div>
                <div class="chart-legend" id="expenseLegend"></div>
            </div>
        </div>

    </div>

    <!-- ===== アクションボタン ===== -->
    <div class="action-bar">
        <a class="btn btn-primary-action" th:href="@{/transactions/new}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            取引を追加
        </a>
        <a class="btn btn-receipt-action" th:href="@{/receipts}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            レシートから追加
        </a>
    </div>

    <!-- ===== 取引履歴 ===== -->
    <div class="card history-card">
        <h2 class="card-heading">取引履歴</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>日付</th>
                    <th>種別</th>
                    <th>カテゴリ</th>
                    <th>金額</th>
                    <th>メモ</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${transactions}"
                    th:class="${t.type.name() == 'INCOME'} ? 'row-income' : 'row-expense'">
                    <td class="cell-date" th:text="${t.date}">2026-06-01</td>
                    <td>
                        <span th:class="${t.type.name() == 'INCOME'} ? 'type-badge badge-income' : 'type-badge badge-expense'"
                              th:text="${t.type.label}">支出</span>
                    </td>
                    <td><span class="category-tag" th:text="${t.category.name}">カテゴリ</span></td>
                    <td class="cell-amount"
                        th:classappend="${t.type.name() == 'INCOME'} ? ' amt-income' : ' amt-expense'"
                        th:text="'¥' + ${#numbers.formatInteger(t.amount, 1, 'COMMA')}">¥0</td>
                    <td class="cell-memo" th:text="${t.memo}"></td>
                    <td class="actions">
                        <a class="btn-sm" th:href="@{/transactions/{id}/edit(id=${t.id})}">編集</a>
                        <form class="inline" method="post" th:action="@{/transactions/{id}/delete(id=${t.id})}"
                              onsubmit="return confirm('削除してよいですか？');">
                            <button class="btn-sm btn-sm-danger" type="submit">削除</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${transactions.isEmpty()}">
                    <td colspan="6" class="empty-row">この月の取引はありません。</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var expenseLabels = /*[[${summary.expenseByCategory.keySet()}]]*/ [];
    var expenseData   = /*[[${summary.expenseByCategory.values()}]]*/ [];
    var incomeLabels  = /*[[${summary.incomeByCategory.keySet()}]]*/ [];
    var incomeData    = /*[[${summary.incomeByCategory.values()}]]*/ [];
    var totalIncome   = /*[[${summary.totalIncome}]]*/ 0;
    var totalExpense  = /*[[${summary.totalExpense}]]*/ 0;
    /*]]>*/

    /* バランスバー */
    (function () {
        var incomeBar   = document.getElementById('balanceBarIncome');
        var expenseBar  = document.getElementById('balanceBarExpense');
        if (!incomeBar || !expenseBar) return;
        var total = totalIncome + totalExpense;
        if (total === 0) return;
        incomeBar.style.width  = (totalIncome  / total * 100) + '%';
        expenseBar.style.width = (totalExpense / total * 100) + '%';
    })();

    /* カラーパレット */
    var incomePalette  = ['#059669', '#0891b2', '#7c3aed', '#0f766e', '#1d4ed8', '#0369a1', '#047857', '#115e59'];
    var expensePalette = ['#e11d48', '#f97316', '#f59e0b', '#8b5cf6', '#ec4899', '#ef4444', '#f43f5e', '#fb923c'];

    /* カスタムレジェンドを生成 */
    function buildLegend(containerId, labels, data, palette) {
        var container = document.getElementById(containerId);
        if (!container || !labels.length) return;
        var total = data.reduce(function (a, b) { return a + b; }, 0);
        container.innerHTML = labels.map(function (label, i) {
            var pct    = total > 0 ? Math.round(data[i] / total * 1000) / 10 : 0;
            var amount = data[i].toLocaleString('ja-JP');
            var color  = palette[i % palette.length];
            return '<div class="legend-item">'
                + '<span class="legend-dot" style="background:' + color + '"></span>'
                + '<div class="legend-body">'
                +   '<div class="legend-name-row">'
                +     '<span class="legend-name">' + label + '</span>'
                +     '<span class="legend-pct">' + pct + '%</span>'
                +   '</div>'
                +   '<div class="legend-bar-track">'
                +     '<div class="legend-bar-fill" style="width:' + pct + '%;background:' + color + '"></div>'
                +   '</div>'
                +   '<div class="legend-amount">¥' + amount + '</div>'
                + '</div>'
                + '</div>';
        }).join('');
    }

    /* ドーナツチャートを描画 */
    function renderDonut(canvasId, centerLabelId, labels, data, palette, typeLabel) {
        var el = document.getElementById(canvasId);
        if (!el || !labels || labels.length === 0) return;
        var total = data.reduce(function (a, b) { return a + b; }, 0);

        new Chart(el, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: labels.map(function (_, i) { return palette[i % palette.length]; }),
                    borderWidth: 3,
                    borderColor: '#fff',
                    hoverBorderColor: '#fff',
                    hoverOffset: 8
                }]
            },
            options: {
                cutout: '66%',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function (ctx) {
                                var pct = total > 0 ? Math.round(ctx.parsed / total * 1000) / 10 : 0;
                                return '  ' + ctx.label + ': ¥' + ctx.parsed.toLocaleString('ja-JP') + ' (' + pct + '%)';
                            }
                        }
                    }
                },
                animation: { animateRotate: true, duration: 900 }
            }
        });

        var center = document.getElementById(centerLabelId);
        if (center) {
            center.innerHTML =
                '<div class="center-type">' + typeLabel + '</div>'
                + '<div class="center-total">¥' + total.toLocaleString('ja-JP') + '</div>';
        }
    }

    renderDonut('incomeChart',  'incomeCenterLabel',  incomeLabels,  incomeData,  incomePalette,  '収入');
    renderDonut('expenseChart', 'expenseCenterLabel', expenseLabels, expenseData, expensePalette, '支出');
    buildLegend('incomeLegend',  incomeLabels,  incomeData,  incomePalette);
    buildLegend('expenseLegend', expenseLabels, expenseData, expensePalette);
</script>
</body>
</html>
