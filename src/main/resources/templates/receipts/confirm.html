<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('レシート確認')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <div class="card">
        <h2>内容を確認して登録</h2>
        <p>読み取った内容を確認・修正してから登録してください。</p>

        <form method="post" th:action="@{/transactions}">
            <input type="hidden" name="type" value="EXPENSE"/>

            <div class="form-group">
                <label for="date">日付</label>
                <input type="date" id="date" name="date"
                       th:value="${#temporals.format(result.date, 'yyyy-MM-dd')}" required/>
            </div>

            <div class="form-group">
                <label for="amount">金額（円）</label>
                <input type="number" id="amount" name="amount"
                       th:value="${result.amount}" min="0" required/>
            </div>

            <div class="form-group">
                <label for="categoryId">カテゴリ</label>
                <select id="categoryId" name="categoryId" required>
                    <option th:each="cat : ${expenseCategories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${cat.id == suggestedCategoryId}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="memo">メモ</label>
                <input type="text" id="memo" name="memo"
                       th:value="${result.storeName != null and !result.storeName.isEmpty()} ? ${result.storeName + (result.memo != null and !result.memo.isEmpty() ? ' ' + result.memo : '')} : ${result.memo}"/>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">登録する</button>
                <a th:href="@{/receipts}" class="btn btn-secondary">やり直す</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
